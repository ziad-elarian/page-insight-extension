<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Insight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .topics {
      margin-bottom: 12px;
    }
    .topics h2 {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .topic-tag {
      display: inline-block;
      background: #334155;
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin: 2px;
    }
    .summary {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .summary h2 {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
    }
    .error {
      color: #f87171;
      font-size: 12px;
      padding: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover { background: #0ea5e9; }
  </style>
</head>
<body>
  <h1>📊 Page Insight</h1>
  <div id="content">
    <div class="loading">Analyzing page...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
